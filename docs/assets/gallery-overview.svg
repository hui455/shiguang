<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Illustrative gallery showing image grid, prompt, parameters, and references"><rect width="1200" height="650" rx="20" fill="#edf2f8"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="48" font-size="22" font-weight="700" fill="#173156">Gallery · Feature overview</text><text x="925" y="48" font-size="14" fill="#526782">ILLUSTRATION / DEMO DATA</text><rect x="28" y="72" width="1144" height="550" rx="16" fill="white"/><text x="52" y="112" font-size="18" fill="#173156">Images</text><rect x="180" y="88" width="480" height="36" rx="8" fill="#f0f4f9"/><text x="196" y="112" font-size="14" fill="#65748b">Search by file name or prompt...</text><rect x="52" y="151" width="193" height="155" rx="10" fill="#c5dcfb"/><circle cx="195" cy="191" r="20" fill="white" opacity=".65"/><path d="M52 306 L117 206 L182 306Z" fill="#486995" opacity=".5"/><text x="52" y="332" fill="#334867" font-size="14">sample-01.png</text><rect x="267" y="151" width="193" height="155" rx="10" fill="#e2d4ef"/><circle cx="410" cy="191" r="20" fill="white" opacity=".65"/><path d="M267 306 L332 206 L397 306Z" fill="#486995" opacity=".5"/><text x="267" y="332" fill="#334867" font-size="14">sample-02.png</text><rect x="482" y="151" width="193" height="155" rx="10" fill="#c8e8df"/><circle cx="625" cy="191" r="20" fill="white" opacity=".65"/><path d="M482 306 L547 206 L612 306Z" fill="#486995" opacity=".5"/><text x="482" y="332" fill="#334867" font-size="14">sample-03.png</text><rect x="52" y="369" width="193" height="155" rx="10" fill="#f5dfbd"/><circle cx="195" cy="409" r="20" fill="white" opacity=".65"/><path d="M52 524 L117 424 L182 524Z" fill="#486995" opacity=".5"/><text x="52" y="550" fill="#334867" font-size="14">sample-04.png</text><rect x="267" y="369" width="193" height="155" rx="10" fill="#d4dafa"/><circle cx="410" cy="409" r="20" fill="white" opacity=".65"/><path d="M267 524 L332 424 L397 524Z" fill="#486995" opacity=".5"/><text x="267" y="550" fill="#334867" font-size="14">sample-05.png</text><rect x="482" y="369" width="193" height="155" rx="10" fill="#f0d5dc"/><circle cx="625" cy="409" r="20" fill="white" opacity=".65"/><path d="M482 524 L547 424 L612 524Z" fill="#486995" opacity=".5"/><text x="482" y="550" fill="#334867" font-size="14">sample-06.png</text><path d="M726 144V588" stroke="#dce4ef"/><text x="756" y="173" font-size="20" font-weight="700" fill="#173156">Every image has a story</text><text x="756" y="219" font-size="14" fill="#65748b">PROMPT</text><rect x="756" y="235" width="380" height="82" rx="8" fill="#f0f4f9"/><text x="772" y="264" font-size="16" fill="#334867">A mountain landscape at sunrise,</text><text x="772" y="290" font-size="16" fill="#334867">soft colors and minimal shapes.</text><text x="756" y="357" font-size="14" fill="#65748b">PARAMETERS</text><text x="756" y="387" font-size="16" fill="#334867">Model · Size · Quality · Background</text><text x="756" y="433" font-size="14" fill="#65748b">REFERENCES</text><rect x="756" y="451" width="78" height="70" rx="8" fill="#c5dcfb"/><path d="M756 521 L792 467 L834 521Z" fill="#7c9dc6"/><text x="850" y="482" font-size="15" fill="#334867">Open reference → return to image</text><rect x="756" y="551" width="174" height="38" rx="8" fill="#2563eb"/><text x="780" y="575" font-size="14" fill="white">Download original</text><text x="953" y="575" font-size="14" fill="#2563eb">Copy share link</text></g></svg>